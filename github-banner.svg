<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Dark Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="50%" stop-color="#121215"/>
      <stop offset="100%" stop-color="#08080A"/>
    </linearGradient>

    <!-- Brand Primary Gradient -->
    <linearGradient id="orangeGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF6633"/>
      <stop offset="100%" stop-color="#FF8552"/>
    </linearGradient>

    <!-- Candlestick Green/Red Gradients -->
    <linearGradient id="candleGreen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="candleRed" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#DC2626"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Background Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.03" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Base Canvas Background -->
  <rect width="1200" height="400" rx="16" fill="url(#bgGradient)"/>

  <!-- Grid Layer -->
  <rect width="1200" height="400" rx="16" fill="url(#grid)"/>

  <!-- Radial Background Lighting Ambient Glows -->
  <circle cx="200" cy="100" r="180" fill="#FF6633" opacity="0.08" filter="url(#glow)"/>
  <circle cx="1000" cy="300" r="220" fill="#2E73CF" opacity="0.06" filter="url(#glow)"/>
  <circle cx="850" cy="120" r="150" fill="#138A63" opacity="0.05" filter="url(#glow)"/>

  <!-- Decorative Chart Grid Lines (Right Area) -->
  <g opacity="0.12" stroke="#ECECEC" stroke-width="1" stroke-dasharray="4 4">
    <line x1="600" y1="80" x2="1140" y2="80"/>
    <line x1="600" y1="140" x2="1140" y2="140"/>
    <line x1="600" y1="200" x2="1140" y2="200"/>
    <line x1="600" y1="260" x2="1140" y2="260"/>
  </g>

  <!-- Right Visual Area: Stylized Candlestick Chart -->
  <!-- Volume Bars -->
  <g opacity="0.25">
    <rect x="630" y="270" width="12" height="40" fill="#10B981" rx="2"/>
    <rect x="660" y="250" width="12" height="60" fill="#EF4444" rx="2"/>
    <rect x="690" y="260" width="12" height="50" fill="#10B981" rx="2"/>
    <rect x="720" y="240" width="12" height="70" fill="#10B981" rx="2"/>
    <rect x="750" y="275" width="12" height="35" fill="#EF4444" rx="2"/>
    <rect x="780" y="230" width="12" height="80" fill="#10B981" rx="2"/>
    <rect x="810" y="220" width="12" height="90" fill="#10B981" rx="2"/>
    <rect x="840" y="250" width="12" height="60" fill="#EF4444" rx="2"/>
    <rect x="870" y="210" width="12" height="100" fill="#10B981" rx="2"/>
    <rect x="900" y="190" width="12" height="120" fill="#10B981" rx="2"/>
    <rect x="930" y="180" width="12" height="130" fill="#10B981" rx="2"/>
    <rect x="960" y="200" width="12" height="110" fill="#EF4444" rx="2"/>
    <rect x="990" y="160" width="12" height="150" fill="#10B981" rx="2"/>
    <rect x="1020" y="140" width="12" height="170" fill="#10B981" rx="2"/>
    <rect x="1050" y="120" width="12" height="190" fill="#FF6633" rx="2"/>
  </g>

  <!-- Candlesticks Wicks & Bodies -->
  <!-- Candle 1 Green -->
  <line x1="636" y1="210" x2="636" y2="275" stroke="#10B981" stroke-width="2"/>
  <rect x="630" y="225" width="12" height="35" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 2 Red -->
  <line x1="666" y1="215" x2="666" y2="280" stroke="#EF4444" stroke-width="2"/>
  <rect x="660" y="230" width="12" height="40" fill="url(#candleRed)" rx="2"/>

  <!-- Candle 3 Green -->
  <line x1="696" y1="195" x2="696" y2="265" stroke="#10B981" stroke-width="2"/>
  <rect x="690" y="210" width="12" height="40" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 4 Green -->
  <line x1="726" y1="180" x2="726" y2="250" stroke="#10B981" stroke-width="2"/>
  <rect x="720" y="195" width="12" height="45" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 5 Red -->
  <line x1="756" y1="200" x2="756" y2="270" stroke="#EF4444" stroke-width="2"/>
  <rect x="750" y="210" width="12" height="30" fill="url(#candleRed)" rx="2"/>

  <!-- Candle 6 Green -->
  <line x1="786" y1="160" x2="786" y2="240" stroke="#10B981" stroke-width="2"/>
  <rect x="780" y="175" width="12" height="50" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 7 Green -->
  <line x1="816" y1="150" x2="816" y2="225" stroke="#10B981" stroke-width="2"/>
  <rect x="810" y="165" width="12" height="45" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 8 Red -->
  <line x1="846" y1="170" x2="846" y2="245" stroke="#EF4444" stroke-width="2"/>
  <rect x="840" y="180" width="12" height="40" fill="url(#candleRed)" rx="2"/>

  <!-- Candle 9 Green (Breakout) -->
  <line x1="876" y1="125" x2="876" y2="215" stroke="#10B981" stroke-width="2"/>
  <rect x="870" y="140" width="12" height="60" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 10 Green -->
  <line x1="906" y1="110" x2="906" y2="190" stroke="#10B981" stroke-width="2"/>
  <rect x="900" y="125" width="12" height="55" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 11 Green -->
  <line x1="936" y1="95" x2="936" y2="175" stroke="#10B981" stroke-width="2"/>
  <rect x="930" y="110" width="12" height="50" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 12 Red -->
  <line x1="966" y1="120" x2="966" y2="195" stroke="#EF4444" stroke-width="2"/>
  <rect x="960" y="135" width="12" height="45" fill="url(#candleRed)" rx="2"/>

  <!-- Candle 13 Green -->
  <line x1="996" y1="80" x2="996" y2="160" stroke="#10B981" stroke-width="2"/>
  <rect x="990" y="95" width="12" height="55" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 14 Green Highlight -->
  <line x1="1026" y1="65" x2="1026" y2="145" stroke="#10B981" stroke-width="2"/>
  <rect x="1020" y="80" width="12" height="55" fill="url(#candleGreen)" rx="2"/>

  <!-- Candle 15 Orange Accent Candle -->
  <line x1="1056" y1="50" x2="1056" y2="130" stroke="#FF6633" stroke-width="2.5"/>
  <rect x="1050" y="65" width="12" height="55" fill="url(#orangeGradient)" filter="url(#subtleGlow)" rx="2"/>

  <!-- Moving Average Line Overlay -->
  <path d="M 610 260 C 670 240, 720 230, 780 195 C 840 170, 900 145, 960 130 C 1000 110, 1040 80, 1090 60" 
        fill="none" stroke="#FF6633" stroke-width="3" stroke-linecap="round" filter="url(#subtleGlow)"/>

  <!-- Pulse Dot at Tip -->
  <circle cx="1090" cy="60" r="5" fill="#FF6633" filter="url(#subtleGlow)"/>
  <circle cx="1090" cy="60" r="10" fill="#FF6633" opacity="0.3"/>

  <!-- Left Side Branding Content -->

  <!-- Brand Tile Icon -->
  <g transform="translate(60, 65)">
    <rect width="64" height="64" rx="16" fill="#18181C" stroke="#FF6633" stroke-opacity="0.4" stroke-width="1.5"/>
    <text x="32" y="44" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="34" fill="url(#orangeGradient)">M</text>
    <polyline points="14,50 22,46 30,48 38,38 46,40 50,34" fill="none" stroke="#10B981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="50" cy="34" r="2.5" fill="#10B981"/>
  </g>

  <!-- Title & Subtitle -->
  <text x="142" y="105" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="38" fill="#ECECEC" letter-spacing="-0.02em">
    Mr. Chartist
  </text>
  <circle cx="366" cy="94" r="5" fill="#FF6633" filter="url(#subtleGlow)"/>

  <text x="142" y="132" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="16" fill="#A1A1AA" letter-spacing="0.01em">
    India's Premier Financial Literacy &amp; Quantitative Research Platform
  </text>

  <!-- SEBI Regulatory Badge Pill -->
  <g transform="translate(60, 160)">
    <rect width="470" height="38" rx="10" fill="#151518" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>
    <!-- SEBI Shield Icon -->
    <path d="M 22 12 L 32 15 L 32 23 C 32 28 22 31 22 31 C 22 31 12 28 12 23 L 12 15 Z" fill="none" stroke="#FF6633" stroke-width="1.8" stroke-linejoin="round"/>
    <text x="42" y="24" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="13" fill="#FF6633" letter-spacing="0.04em">SEBI REGISTERED RESEARCH ANALYST</text>
    <text x="310" y="24" font-family="'Lato', monospace, sans-serif" font-weight="600" font-size="13" fill="#ECECEC">INH000015297</text>
  </g>

  <!-- Author Badge -->
  <g transform="translate(60, 212)">
    <text x="0" y="18" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="14" fill="#D4D4D8">
      Founded &amp; Authored by <tspan font-weight="700" fill="#FFFFFF">Rohit Singh</tspan>
    </text>
  </g>

  <!-- 9 Module Pill Colors Bar -->
  <g transform="translate(60, 255)">
    <!-- Pill 1: Sapphire -->
    <rect x="0" y="0" width="14" height="14" rx="4" fill="#2E73CF"/>
    <!-- Pill 2: Plum -->
    <rect x="22" y="0" width="14" height="14" rx="4" fill="#A8458C"/>
    <!-- Pill 3: Sunset -->
    <rect x="44" y="0" width="14" height="14" rx="4" fill="#E0632F"/>
    <!-- Pill 4: Forest Emerald -->
    <rect x="66" y="0" width="14" height="14" rx="4" fill="#138A63"/>
    <!-- Pill 5: Royal Onyx Teal -->
    <rect x="88" y="0" width="14" height="14" rx="4" fill="#1F8597"/>
    <!-- Pill 6: Magenta -->
    <rect x="110" y="0" width="14" height="14" rx="4" fill="#D11A6E"/>
    <!-- Pill 7: Crimson -->
    <rect x="132" y="0" width="14" height="14" rx="4" fill="#C42B3C"/>
    <!-- Pill 8: Royal Navy -->
    <rect x="154" y="0" width="14" height="14" rx="4" fill="#5E6FAC"/>
    <!-- Pill 9: Gold -->
    <rect x="176" y="0" width="14" height="14" rx="4" fill="#A8801F"/>

    <text x="202" y="12" font-family="'Inter', system-ui, sans-serif" font-weight="500" font-size="13" fill="#71717A">
      9 Core Learning Modules • NISM Series 1–24 • Sector &amp; Company Analysis
    </text>
  </g>

  <!-- Bottom Bar Divider -->
  <line x1="60" y1="330" x2="1140" y2="330" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1"/>

  <!-- Footer Info Line -->
  <g transform="translate(60, 362)">
    <text font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="#A1A1AA">
      🌐 Website: <tspan fill="#FF6633">mrchartist.com</tspan>
    </text>
    <text x="240" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="#A1A1AA">
      ⚡ Investology: <tspan fill="#ECECEC">investology.mrchartist.com</tspan>
    </text>
    <text x="560" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="#A1A1AA">
      📊 FII/DII Tracker: <tspan fill="#ECECEC">fii-diidata.mrchartist.com</tspan>
    </text>
    <text x="890" font-family="'Inter', system-ui, sans-serif" font-weight="600" font-size="13" fill="#71717A">
      React 18 • Vite • TS • Supabase
    </text>
  </g>
</svg>
